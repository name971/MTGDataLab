name: Archive old price history to R2 (weekly)

# card_print_prices（Supabase、プリント単位JSONB）が無期限に増え続けてSupabase無料枠500MBを
# 圧迫する問題への対応。60日より古い日付キーをCloudflare R2（jp-mtgstocks-price-archive、
# scripts/lib/r2PriceArchive.mjs）へ移し、Supabase側から削除する
# （scripts/archive-old-print-prices.mjs）。日次では変化が小さいため週次で十分。
#
# card_cheapest_price_snapshots（オラクル単位）は既に日次の新規書き込みが無くなり常に空の
# ため、そちらのアーカイブ（旧scripts/archive-old-price-snapshots.mjs）は廃止した。
on:
  schedule:
    - cron: "0 5 * * 1" # 毎週月曜 14:00 JST（daily-data-pipelineの後）
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ランナー同梱のnpmはlockfileVersion 3のoptionalDependencies同期チェックが
      # 甘く、実際には存在するのに"missing from lock file"と誤検知することがあるため、
      # ローカル開発環境と揃えて最新版に上げてからnpm ciする（daily-data-pipeline.ymlと同じ対策）。
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Archive old print prices to R2
        run: node scripts/archive-old-print-prices.mjs
