name: Archive old price history to D1 (weekly)

# card_cheapest_price_snapshots（Supabase）が無期限に増え続けてSupabase無料枠500MBを
# 圧迫する問題への対応。90日より古い行をCloudflare D1（jp-mtgstocks-archive、無料枠5GB）へ
# 移し、Supabase側から削除する（scripts/archive-old-price-snapshots.mjs、
# db/archive-schema.sql参照）。日次では変化が小さいため週次で十分。
on:
  schedule:
    - cron: "0 5 * * 1" # 毎週月曜 14:00 JST（daily-data-pipelineの後）
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Archive old price snapshots to D1
        run: node scripts/archive-old-price-snapshots.mjs
