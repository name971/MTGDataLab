name: Daily data pipeline

# トーナメント取り込み → 価格スナップショット → 集計（採用率・注目カード）を毎日順番に実行する。
# Scryfallバルクデータ（2GB超）・Node.jsのファイルシステムキャッシュに依存するため、
# Cloudflare Workers（本番ホスティング）ではなくGitHub Actionsのランナーで実行する。
on:
  schedule:
    - cron: "0 3 * * *" # 12:00 JST
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ランナー同梱のnpmはlockfileVersion 3のoptionalDependencies同期チェックが
      # 甘く、実際には存在するのに"missing from lock file"と誤検知することがあるため、
      # ローカル開発環境と揃えて最新版に上げてからnpm ciする。
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # デバッグ用: シークレットの値そのものは出さず、長さと先頭/末尾数文字だけ確認する
      # （401 Invalid API key の原因切り分け用。原因が分かったら削除する）
      - name: Debug secret shape
        run: |
          node -e '
            const url = process.env.NEXT_PUBLIC_SUPABASE_URL ?? "";
            const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY ?? "";
            console.log("URL length:", url.length, "head:", JSON.stringify(url.slice(0,12)), "tail:", JSON.stringify(url.slice(-12)));
            console.log("KEY length:", key.length, "head:", JSON.stringify(key.slice(0,8)), "tail:", JSON.stringify(key.slice(-8)));
          '

      - name: Debug live request from runner
        run: |
          node -e '
            const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
            const key = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;
            fetch(`${url}/rest/v1/tournaments?select=id&limit=1`, {
              headers: { apikey: key, Authorization: `Bearer ${key}` },
            }).then(async (r) => {
              console.log("status:", r.status);
              console.log("body:", await r.text());
              console.log("headers:", JSON.stringify([...r.headers.entries()]));
            }).catch((e) => console.log("fetch threw:", e));
          '

      - name: Import tournaments (TopDeck.gg)
        run: node scripts/import-tournaments.mjs

      - name: Import MTGO decklists
        run: node scripts/import-mtgo-decklists.mjs

      - name: Resolve deck card oracle_ids
        run: node scripts/import-deck-cards.mjs

      - name: Snapshot today's card prices
        run: node scripts/snapshot-prices.mjs

      - name: Compute usage stats / archetype price stats
        run: node scripts/compute-deck-stats.mjs

      - name: Compute trending scores
        run: node scripts/compute-trending-scores.mjs
