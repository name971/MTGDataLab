name: Daily data pipeline

# トーナメント取り込み → 価格スナップショット → 集計（採用率・注目カード）を毎日順番に実行する。
# Scryfallバルクデータ（2GB超）・Node.jsのファイルシステムキャッシュに依存するため、
# Cloudflare Workers（本番ホスティング）ではなくGitHub Actionsのランナーで実行する。
on:
  schedule:
    - cron: "0 3 * * *" # 12:00 JST
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # MTGO取り込みのレート制限対策（バッチ単位リトライ）で1フォーマットあたり10分超かかる
    # ようになり、45分だと後半（デッキ解決・アーキタイプ分類・集計）まで到達できず
    # タイムアウトでキャンセルされる事故が実際に発生し、90分に引き上げた。2026-08-21、
    # 採用率アーカイブのR2永続化・MLランキング自動更新のステップを追加してさらに後半が
    # 重くなり、90分でも後半（Compute trending scores以降）に到達できずキャンセルされる
    # 事故が再発したため150分に引き上げた。2026-08-22、MLランキング関連ステップは
    # ml-ranking.yml（このワークフロー完了後にworkflow_runで連動）へ切り出したため
    # 本来はもう短くて良いが、切り戻しの余地を残すため据え置く。
    timeout-minutes: 150
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
      # scripts/snapshot-catalog-prices.mjsがD1（catalog_prints、デッキ未使用カードの
      # scryfall_id→oracle_id対応）をHTTP API経由で読むために必要。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 価格履歴アーカイブ（scripts/lib/r2PriceArchive.mjs、月次バルク＋カード単位ファイル、
      # デッキ未使用カード含む全カードの長期価格履歴）が読み書きするために必要。D1無料枠の
      # 日次読み書き行数上限に達したため、価格履歴はD1からR2へ全面移行した。
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      # scripts/lib/scryfallBulk.mjsはScryfallバルクデータ（374MB）の更新日時を見て
      # 変化が無ければ再ダウンロードをスキップする仕組みを既に持っているが、GitHub Actions
      # は毎回まっさらなVMのためこのキャッシュ（.cache/）が永続化されず、実質毎日フル
      # ダウンロードし続けていた（2026-08-22判明）。actions/cacheで.cache/を永続化し、
      # 既存のスキップ判定を実際に効かせる。actions/cacheのキーは一度保存すると同じキーでは
      # 上書きできないため、日付を含めた一意キー＋前日以前のキーをrestore-keysで拾う形にする
      # （固定キーだとScryfallが更新された日以降ずっと古いキャッシュのままになってしまう）。
      - uses: actions/cache@v4
        with:
          path: .cache
          key: scryfall-bulk-cache-${{ github.run_id }}
          restore-keys: scryfall-bulk-cache-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ml/predict_and_publish.py（注目カードランキングの価格予測モデル）用。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies (ml)
        run: pip install -r ml/requirements.txt

      # ランナー同梱のnpmはlockfileVersion 3のoptionalDependencies同期チェックが
      # 甘く、実際には存在するのに"missing from lock file"と誤検知することがあるため、
      # ローカル開発環境と揃えて最新版に上げてからnpm ciする。
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # card_price_snapshots（代表プリント単体の日次価格）はgetPriceHistoryForCard/
      # getLatestPriceSnapshotの参照元をcard_cheapest_price_snapshots（全プリント横断の最安値）に
      # 置き換えた後も書き込みだけが残っていた未使用テーブルだったため、snapshot-prices.mjsの
      # 実行自体を削除した（DB容量超過対応）。ただし同スクリプトはexchange_rates（為替レート）の
      # 更新も兼ねていたため、削除時に為替レート更新まで巻き添えで止まっていた
      # （当日分のレートが無いとUSD建て価格がJPYに換算できず、価格表示が丸ごと欠落する事故が
      # 実際に発生した）。為替レート取得だけを独立したスクリプトとして復活させ、価格取得より先に置く。
      - name: Snapshot exchange rates
        run: node scripts/snapshot-exchange-rates.mjs

      - name: Snapshot today's print prices (all versions)
        run: node scripts/snapshot-print-prices.mjs

      - name: Compute cheapest-print-price snapshots
        run: node scripts/compute-cheapest-price-snapshots.mjs

      # デッキ未使用カード（catalog_oracles/catalog_prints、card_printsの追跡対象外）の当日分価格を
      # R2へ追記する。以前はTCGCSVを別データソースとして使っていたが、Scryfall bulk data
      # （上のsnapshot-print-prices.mjsが既にダウンロード・キャッシュ済み）が事実上「全カード」の
      # 価格を持っているため、デッキ未使用カードだけ別ソースを使う理由が無かった。1つのデータ
      # ソースに寄せてTCGCSV/py7zr/boto3への依存を日次パイプラインから外した。
      # 他ステップの成否に関わらず進める。
      - name: Snapshot catalog-only card prices to R2 (Scryfall bulk)
        continue-on-error: true
        run: node scripts/snapshot-catalog-prices.mjs

      # パックEV: パック単品の実勢価格（TCGCSV）はレート制限を気にせず取得できる別ソースなので
      # 他ステップの成否に関わらず進める。片方が失敗してもEVページ側でフォールバックする。
      - name: Snapshot pack prices (TCGCSV)
        continue-on-error: true
        run: node scripts/snapshot-pack-prices.mjs

      - name: Compute pack slot avg prices
        continue-on-error: true
        run: node scripts/compute-pack-slot-avg-prices.mjs

      # import-tournaments.mjsは引数無しだとStandardのみ取得する。Commanderはmtgo.comに
      # 無い形式でTopDeck.gg取り込みだけが頼りのため、明示的に別ステップで呼ぶ
      # （呼び忘れると採用率/使用デッキが古いまま静かに止まる。実際に約2週間気づかず止まっていた）。
      # continue-on-error: 1フォーマットの取り込み失敗で他フォーマット・後続の集計まで
      # 止まらないようにする（外部サイト依存で個別に失敗しうるため）。
      - name: Import tournaments (TopDeck.gg, Standard)
        continue-on-error: true
        run: node scripts/import-tournaments.mjs Standard

      - name: Import tournaments (TopDeck.gg, Commander)
        continue-on-error: true
        run: node scripts/import-tournaments.mjs Commander

      # import-mtgo-decklists.mjsは引数無しだとPioneerのみ取得する。mtgo.com/decklistsには
      # Standard/Modern/Legacy/Vintageの分もあるため、対応フォーマット全部を個別に呼ぶ
      # （Commanderはmtgo.comに無い形式のためTopDeck.gg取り込みのみに任せる）。
      - name: Import MTGO decklists (Standard)
        continue-on-error: true
        run: node scripts/import-mtgo-decklists.mjs standard Standard

      - name: Import MTGO decklists (Pioneer)
        continue-on-error: true
        run: node scripts/import-mtgo-decklists.mjs pioneer Pioneer

      - name: Import MTGO decklists (Modern)
        continue-on-error: true
        run: node scripts/import-mtgo-decklists.mjs modern Modern

      - name: Import MTGO decklists (Legacy)
        continue-on-error: true
        run: node scripts/import-mtgo-decklists.mjs legacy Legacy

      - name: Import MTGO decklists (Vintage)
        continue-on-error: true
        run: node scripts/import-mtgo-decklists.mjs vintage Vintage

      - name: Resolve deck card oracle_ids
        continue-on-error: true
        run: node scripts/import-deck-cards.mjs

      # classify-decks.ts / classify-decks-commander.mjsはどのワークフローにも組み込まれておらず、
      # 手動実行でしかarchetype_idが更新されていなかった（アーキタイプランキングの分母に
      # 未分類デッキが4〜6割溜まっていた原因）。日次で回して毎日分類する。
      - name: Classify decks (Standard)
        continue-on-error: true
        run: npx tsx scripts/classify-decks.ts Standard

      - name: Classify decks (Pioneer)
        continue-on-error: true
        run: npx tsx scripts/classify-decks.ts Pioneer

      - name: Classify decks (Modern)
        continue-on-error: true
        run: npx tsx scripts/classify-decks.ts Modern

      - name: Classify decks (Legacy)
        continue-on-error: true
        run: npx tsx scripts/classify-decks.ts Legacy

      - name: Classify decks (Vintage)
        continue-on-error: true
        run: npx tsx scripts/classify-decks.ts Vintage

      - name: Classify decks (Commander)
        continue-on-error: true
        run: node scripts/classify-decks-commander.mjs

      - name: Compute usage stats / archetype price stats
        run: node scripts/compute-deck-stats.mjs

      # card_usage_statsは削除されず積み上がる一方だった（DB容量超過の原因の一つ）。
      # 実際に読まれるのは直近60日以内だけなので、それより古い行は日次で削除する。
      - name: Prune old usage stats
        run: node scripts/prune-old-usage-stats.mjs

      - name: Compute trending scores
        run: node scripts/compute-trending-scores.mjs

      # card_streaks（トップページ「継続注目カード」）はR2価格履歴（compute-cheapest-price-
      # snapshots.mjsが書き込む、このワークフロー前半）とcard_usage_stats（ひとつ上のステップ）
      # の両方を必要とするため、両方が終わった後の最後に置く。
      - name: Compute card streaks
        run: node scripts/compute-card-streaks.mjs

      # Supabase無料枠（500MB）超過に日次で気づけるよう、パイプラインの最後にDB容量を
      # チェックする。VACUUM自体はPostgRESTから実行できない（トランザクション内で使えない
      # コマンドのため）ので自動修復はせず、閾値超過をジョブサマリーに警告として出すのみ。
      - name: Check DB size
        continue-on-error: true
        run: node scripts/check-db-size.mjs

      # パックEVのmatch_rateが参照テーブルのズレで17〜23%まで落ちていても誰も気づかず
      # 何日も放置される事故があった。同種の「集計は動いているがデータが実質空/古いまま」を
      # 早期発見するため、主要な集計データの完全性・鮮度をまとめてチェックする。
      - name: Check data health
        continue-on-error: true
        run: node scripts/check-data-health.mjs
