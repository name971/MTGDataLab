name: Update ML card ranking (weekly)

# 注目カードランキング（高騰予想）の学習・再計算・公開を週次で自動化する。
#
# 曜日は金曜（JST）に固定している。理由（2026-09-15、ユーザーと検討）:
#   - Commanderのトーナメント結果登録は土曜に極端に偏る（直近60日実測で土曜だけ5,256件、
#     他の曜日は多くて500件台）。採用率集計（compute-deck-stats.mjs）はLAG_DAYS=3で
#     直近3日を除外するため、金曜実行なら除外範囲は水木金の3日だけで、直前の土曜日
#     （6日前）のデータは完全に安定した状態で使える。
#   - ユーザー視点でも、直前の週末の大会結果を織り込んだ予想を「次の週末に買い物・
#     デッキ構築をする直前」の金曜に届けられるのが理にかなっている（火曜等もっと早く
#     出す案も検討したが、データの安定性とユーザーが実際に使うタイミングの両方を
#     満たすのは金曜という結論になった）。
#
# 以前は日次パイプラインに組み込んでいたが、continue-on-error付きで他ステップと
# まとめて実行していたため失敗が何日も気づかれなかった事故（2026-08-27、
# docs/incident-log.md参照）を受けて独立ワークフローとして切り出した経緯がある。
# 今回はその教訓を踏まえ、continue-on-errorを付けずジョブ自体の成否がそのまま
# 失敗として見えるようにする。
on:
  schedule:
    - cron: "0 20 * * 5" # 毎週金曜 05:00 JST（土曜）: cronはUTC指定のため前日20:00 UTC
  workflow_dispatch:

jobs:
  update-ml-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      # ml/predict_and_publish.pyのensure_fresh_data()が、このキャッシュのmtimeが
      # 20時間より古ければ実行を中断する（2026-08-27の「古いデータのまま本番へ書き込んだ」
      # 事故の再発防止）。同一ジョブ内で続けて実行するので必ず新鮮な状態で通る。
      - name: Fetch base training data (price history, usage stats, static attrs)
        run: python ml/fetch_data.py

      - name: Train and publish ML card ranking
        run: python ml/predict_and_publish.py
