name: ML card ranking

# TOPページ「注目カードランキング」（高騰予想/暴落予想）の日次更新。
# 元々daily-data-pipeline.ymlの末尾に含めていたが、ここだけ切り出して独立させた
# （2026-08-22）。理由:
#   1. GitHub Actionsのジョブは失敗しても全体が"success"に見えてしまう
#      （continue-on-error: true、実際にml/fetch_data.pyの呼び忘れに何日も気づけなかった
#      事故が発生、docs/incident-log.md参照）ため、このジョブ単体の成否を見やすくする。
#   2. このジョブだけの動作確認・デバッグに、毎回100分超かかるdaily-data-pipeline全体を
#      待つ必要が無いようにする（workflow_dispatchで単独実行できる）。
# daily-data-pipelineが集計したcard_usage_stats/デッキ分類結果に依存するため、
# それが完了した後に走る必要がある。workflow_runでの連動はworkflow_dispatchで手動実行
# する一覧にワークフローが出るためにmasterブランチへの反映が必須になり手間だったため、
# 単純にdaily-data-pipeline（03:00 UTC開始、タイムアウト150分）より後の時刻に
# 独立したスケジュールを組む方式にした（2026-08-22）。
on:
  schedule:
    - cron: "0 6 * * *" # 15:00 JST、daily-data-pipeline開始から3時間後
  workflow_dispatch:

jobs:
  ml_ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      TOPDECK_API_KEY: ${{ secrets.TOPDECK_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies (ml)
        run: pip install -r ml/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      # ml/predict_and_publish.pyが読むml/data/price_history.parquet・static_attrs.parquetを
      # 生成する（R2 price-history/Supabase/D1から取得）。
      - name: Fetch base training data (price history, static attrs)
        run: python ml/fetch_data.py

      # card_usage_stats（Supabase）は直近60日分しか無く、価格予測モデルの学習には
      # それでは足りない（TopDeck.gg由来の15ヶ月分アーカイブで的中率が明確に改善した実績、
      # docs/price-prediction-plan.md参照）。直近21日分だけTopDeckから再取得・再計算し
      # （7日ローリング窓の計算に7日分の余白を持たせるため21日）、R2（usage-history/）の
      # 長期アーカイブへ差分マージする。
      - name: Fetch recent tournament usage history (TopDeck.gg)
        continue-on-error: true
        run: node ml/fetch_tournament_history.mjs 21

      - name: Build usage history from tournaments
        continue-on-error: true
        run: python ml/build_usage_history_from_tournaments.py

      - name: Sync usage archive to R2
        continue-on-error: true
        run: python ml/sync_usage_archive_to_r2.py

      - name: Predict and publish ML card ranking
        run: python ml/predict_and_publish.py
